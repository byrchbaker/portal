{% for team in teams %}
<tr class="border-b border-gray-800 hover:bg-gray-800/40 transition-colors" data-team-id="{{ team.team_id }}">
    <td class="py-2 px-4 text-left">
        {% if team.team_id %}
        <a class="text-blue-300 hover:underline font-semibold"
            href="{{ url_for('team_scoreboard', team_id=team.team_id) }}">
            {{ team.team_name }}
        </a>
        {% else %}
        {{ team.team_name }}
        {% endif %}
    </td>
    <td class="py-2 px-4">{{ team.web }}</td>
    <td class="py-2 px-4">{{ team.uptime }}</td>
    <td class="py-2 px-4">{{ team.penalties }}</td>
    <td class="py-2 px-4">{{ team.image_scores }}</td>
    <td class="py-2 px-4 text-white font-bold">{{ team.total }}</td>
</tr>
{% endfor %}
