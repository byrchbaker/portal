<!-- admin/create_inject.html -->
{% extends 'base.html' %}
{% block title %}New Inject{% endblock %}
{% block content %}
<main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">🧨 Create Inject</h1>
    <form action="{{ url_for('create_inject') }}" method="POST" enctype="multipart/form-data" class="space-y-4">
        <input type="text" name="title" placeholder="Title" required class="w-full p-2 rounded bg-gray-800 text-white">

        <label class="block text-white">Attach Instructions File (PDF):</label>
        <input type="file" name="file" accept="application/pdf" class="block">

        <label class="block text-white">Set Countdown (in minutes):</label>
        <input type="number" name="countdown" min="1" placeholder="e.g. 120 for 2 hours"
            class="w-full p-2 rounded bg-gray-800 text-white">

        <label class="block text-white">Status:</label>
        <select name="status" class="w-full p-2 rounded bg-gray-800 text-white">
            <option value="Offline">Offline</option>
            <option value="Online">Online</option>
        </select>

        <button type="submit" class="bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700">Submit
            Inject</button>
    </form>
</main>
{% endblock %}
