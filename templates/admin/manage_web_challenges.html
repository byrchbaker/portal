{% extends 'base.html' %}
{% block title %}Manage Web Challenges{% endblock %}
{% block content %}
<main class="max-w-6xl mx-auto p-6 space-y-6">
    <h1 class="text-3xl font-bold">🗂 Manage Web Challenges</h1>
    <a href="{{ url_for('create_web_challenge') }}"
        class="inline-flex items-center gap-2 bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded">
        ➕ <span>New</span>
    </a>
    <div class="overflow-x-auto rounded-xl mt-4">
        <table class="min-w-full bg-gray-900 text-left text-sm">
            <thead class="text-gray-400 border-b border-gray-700">
                <tr>
                    <th class="py-2 px-4">Title</th>
                    <th class="py-2 px-4">Score</th>
                    <th class="py-2 px-4">Status</th>
                    <th class="py-2 px-4">Actions</th>
                </tr>
            </thead>
            <tbody class="text-gray-300">
                {% for c in items %}
                <tr class="border-b border-gray-800">
                    <td class="py-2 px-4">{{ c.title }}</td>
                    <td class="py-2 px-4">{{ c.score }}</td>
                    <td class="py-2 px-4">{{ c.status or '--' }}</td>
                    <td class="py-2 px-4 space-x-2">
                        <a href="{{ url_for('edit_web_challenge', item_id=c.id) }}"
                            class="px-3 py-1 bg-gray-700 rounded">Edit</a>
                        <form action="{{ url_for('delete_web_challenge', item_id=c.id) }}" method="POST" class="inline"
                            onsubmit="return confirm('Delete this challenge and all submissions?');">
                            <button class="px-3 py-1 bg-red-600 rounded text-white">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>
{% endblock %}
