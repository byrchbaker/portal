{% extends 'base.html' %}
{% block title %}Edit Inject{% endblock %}
{% block content %}
<main class="max-w-3xl mx-auto p-6 space-y-4">
    <h1 class="text-2xl font-bold">✏️ Edit Inject</h1>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <input name="title" value="{{ item.title }}" class="w-full p-2 rounded bg-gray-800 text-white" required>
        <label class="block text-white">Countdown (minutes)</label>
        <input type="number" name="countdown" value="{{ item.countdown_minutes }}"
            class="w-full p-2 rounded bg-gray-800 text-white">
        <label class="block text-white">Status</label>
        <select name="status" class="w-full p-2 rounded bg-gray-800 text-white">
            <option value="Offline" {{ 'selected' if item.status=='Offline' else '' }}>Offline</option>
            <option value="Online" {{ 'selected' if item.status=='Online' else '' }}>Online</option>
        </select>
        <label class="block text-white">Replace file (optional)</label>
        <input type="file" name="file" class="block">
        <button class="bg-yellow-600 text-white px-4 py-2 rounded">Save</button>
    </form>
</main>
{% endblock %}
