{% extends 'base.html' %}
{% block title %}New Web Challenge{% endblock %}
{% block content %}
<main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">💻 Create Web Challenge</h1>
    <form action="" method="POST" enctype="multipart/form-data" class="space-y-4">
        <input type="text" name="title" placeholder="Title" required class="w-full p-2 rounded bg-gray-800 text-white">
        <input type="number" name="score" placeholder="Score" class="w-full p-2 rounded bg-gray-800 text-white">
        <input type="file" name="file" class="block">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Submit</button>
    </form>
</main>
{% endblock %}
